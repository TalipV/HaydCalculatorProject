name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # SDK version is pinned in global.json, so CI and local builds use the same SDK.
          global-json-file: global.json

      # global.json pins sdk.workloadVersion; the SDK refuses to evaluate any project
      # until that workload set is installed, even projects that use no workloads.
      - name: Install workload set from global.json
        run: dotnet workload update

      - name: Build test projects
        run: dotnet build tests/HaydCalculator.Core.Tests.Unit/HaydCalculator.Core.Tests.Unit.csproj -c Release

      - name: Run tests
        run: >
          dotnet test tests/HaydCalculator.Core.Tests.Unit/HaydCalculator.Core.Tests.Unit.csproj
          -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory TestResults

      - name: Test report
        # Fork PRs get a read-only token and cannot create check runs.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: dorny/test-reporter@v2
        with:
          name: .NET Tests
          path: TestResults/*.trx
          reporter: dotnet-trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.sha }}
          path: TestResults/*.trx
          retention-days: 30

  build-android:
    # APKs are only built for main (push or manual run), never for pull requests.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 90
    # Two quick pushes must not delete/recreate the rolling release at the same time.
    concurrency:
      group: rolling-release
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v6
        with:
          # SDK version is pinned in global.json, so CI and local builds use the same SDK.
          global-json-file: global.json

      # global.json pins sdk.workloadVersion; the SDK refuses to evaluate any project
      # until that workload set is installed, even projects that use no workloads.
      - name: Install workload set from global.json
        run: dotnet workload update

      # No --version: the workload set version comes from global.json (sdk.workloadVersion).
      - name: Install MAUI Android workload
        run: |
          dotnet workload install maui-android
          dotnet workload --version

      - name: Build date
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      # No signing secrets yet: the APK is signed with the Android SDK's auto-generated
      # debug keystore. For a stable signature, add ANDROID_KEYSTORE_B64 & co. as repository
      # secrets and pass them like PrayerTimeEngine's android-apk workflow does.
      - name: Build Release APK
        run: >
          dotnet publish HaydCalculator.MAUI/HaydCalculator.MAUI.csproj
          -c Release -f net10.0-android
          -p:EnableLLVM=false

      - name: Collect APK
        run: |
          mkdir -p out
          cp HaydCalculator.MAUI/bin/Release/net10.0-android/*-Signed.apk "out/HaydCalculator-release.apk"
          ls -lh out

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ github.sha }}
          path: out/*.apk
          retention-days: 30

      # The rolling "latest" release is recreated on every build: action-gh-release only
      # appends assets to an existing release and never moves an existing tag, so without
      # this the asset list keeps growing and the tag stays on an old commit.
      - name: Remove previous rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true

      - name: Publish rolling release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Latest build (${{ env.BUILD_DATE }})
          body: |
            Automatic build of `main` — commit ${{ github.sha }}
            Date: ${{ env.BUILD_DATE }}

            Permanent download link (always points to the latest build):
            https://github.com/${{ github.repository }}/releases/download/latest/HaydCalculator-release.apk
          prerelease: true
          files: out/*.apk
