name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # SDK version is pinned in global.json, so CI and local builds use the same SDK.
          global-json-file: global.json

      # global.json pins sdk.workloadVersion; the SDK refuses to evaluate any project
      # until that workload set is installed, even projects that use no workloads.
      - name: Install workload set from global.json
        run: dotnet workload update

      - name: Build test projects
        run: dotnet build tests/HaydCalculator.Core.Tests.Unit/HaydCalculator.Core.Tests.Unit.csproj -c Release

      - name: Run tests
        run: >
          dotnet test tests/HaydCalculator.Core.Tests.Unit/HaydCalculator.Core.Tests.Unit.csproj
          -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory TestResults

      - name: Test report
        # Fork PRs get a read-only token and cannot create check runs.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: dorny/test-reporter@v2
        with:
          name: .NET Tests
          path: TestResults/*.trx
          reporter: dotnet-trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.sha }}
          path: TestResults/*.trx
          retention-days: 30

  build-android:
    # APKs are only built for main (push or manual run), never for pull requests.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 90
    # Two quick pushes must not delete/recreate the rolling release at the same time.
    concurrency:
      group: rolling-release
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # .NET 11 for Android (API 37) requires JDK 21 or newer
          java-version: '21'

      - uses: actions/setup-dotnet@v6
        with:
          # SDK version is pinned in global.json, so CI and local builds use the same SDK.
          global-json-file: global.json

      # global.json pins sdk.workloadVersion; the SDK refuses to evaluate any project
      # until that workload set is installed, even projects that use no workloads.
      - name: Install workload set from global.json
        run: dotnet workload update

      # No --version: the workload set version comes from global.json (sdk.workloadVersion).
      - name: Install MAUI Android workload
        run: |
          dotnet workload install maui-android
          dotnet workload --version

      # The runner image does not necessarily ship the Android platform that the
      # target framework needs (net11.0-android = API 37); install whatever is missing.
      - name: Install Android SDK dependencies
        run: >
          dotnet build HaydCalculator.MAUI/HaydCalculator.MAUI.csproj
          -t:InstallAndroidDependencies -f net11.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:AcceptAndroidSDKLicenses=True

      # APP_VERSION is the display version from the csproj; the run number becomes the
      # Android versionCode, so every build counts up and installs as an update.
      - name: Build info
        run: |
          echo "BUILD_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
          version=$(sed -n 's:.*<ApplicationDisplayVersion>\(.*\)</ApplicationDisplayVersion>.*:\1:p' HaydCalculator.MAUI/HaydCalculator.MAUI.csproj)
          if [ -z "$version" ]; then echo "::error::ApplicationDisplayVersion not found in csproj."; exit 1; fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      # Signs with the release keystore from the repository secrets, so every build has the
      # same signature and installed apps can be updated. Passwords reach the build through
      # environment variables (env: prefix), never through the command line.
      # Fork pull requests get no secrets: they fall back to the debug keystore, and their APK
      # is only uploaded as a build artifact. A build of main without secrets fails, so a
      # debug-signed APK is never published.
      - name: Build Release APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          signing_args=()
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.keystore"
            signing_args=(
              -p:AndroidKeyStore=true
              "-p:AndroidSigningKeyStore=$RUNNER_TEMP/signing.keystore"
              "-p:AndroidSigningKeyAlias=$KEY_ALIAS"
              -p:AndroidSigningKeyPass=env:KEY_PASSWORD
              -p:AndroidSigningStorePass=env:KEYSTORE_PASSWORD
            )
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "::error::Signing secrets missing (ANDROID_KEYSTORE_B64 & co.). Refusing to publish a debug-signed APK."
            exit 1
          else
            echo "::warning::No signing secrets available; this APK is signed with the debug keystore."
          fi
          dotnet publish HaydCalculator.MAUI/HaydCalculator.MAUI.csproj \
            -c Release -f net11.0-android \
            -p:ApplicationVersion=${{ github.run_number }} \
            "${signing_args[@]}"

      - name: Collect APK
        run: |
          mkdir -p out
          cp HaydCalculator.MAUI/bin/Release/net11.0-android/*-Signed.apk \
             "out/HaydCalculator-${APP_VERSION}.apk"
          ls -lh out

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ github.sha }}
          path: out/*.apk
          retention-days: 30

      # The rolling "latest" release is recreated on every build: action-gh-release only
      # appends assets to an existing release and never moves an existing tag, so without
      # this the asset list keeps growing and the tag stays on an old commit.
      - name: Remove previous rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true

      - name: Publish rolling release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: ${{ env.APP_VERSION }} (build ${{ github.run_number }}, ${{ env.BUILD_DATE }})
          body: |
            Automatic build of `main` — commit ${{ github.sha }}
            Version: ${{ env.APP_VERSION }} (build ${{ github.run_number }})
            Date: ${{ env.BUILD_DATE }}

            Permanent link to this page (always shows the latest build):
            https://github.com/${{ github.repository }}/releases/tag/latest
          prerelease: true
          files: out/*.apk
